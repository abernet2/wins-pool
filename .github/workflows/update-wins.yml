name: Update wins

on:
  schedule:
    # Games run Thu night through Mon night (US time); UTC days Thu-Tue cover that.
    - cron: "*/30 * * * 0,1,2,4,5,6"
    # One check midweek to catch stat corrections.
    - cron: "0 12 * * 3"
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  actions: write   # to re-enable this workflow (see the keep-alive step)

concurrency:
  group: update-wins
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      # GitHub switches scheduled workflows off after 60 days without repo activity, which would
      # happen every off-season. Re-enabling the workflow resets that timer; it is a no-op when active.
      - name: Keep the schedule alive
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api -X PUT "repos/${{ github.repository }}/actions/workflows/update-wins.yml/enable"
      - name: Fetch records from ESPN
        run: python3 scripts/fetch_wins.py
      - name: Commit and publish if changed
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ -n "$(git status --porcelain data/)" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add data/
            git commit -m "Update team records"
            # Someone may have pushed since this run checked out; rebase onto it, and retry once if we still lose the race.
            git pull --rebase -q && git push || { sleep 5; git pull --rebase -q && git push; }
            # Pushes made with GITHUB_TOKEN don't always trigger a Pages build, so ask for one. The data is already
            # committed at this point, so a failure here must not fail the run.
            gh api -X POST "repos/${{ github.repository }}/pages/builds" --silent \
              || echo "::warning::Pages rebuild request failed; the push normally triggers one anyway"
          fi
