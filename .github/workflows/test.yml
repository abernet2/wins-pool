name: Tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: JavaScript tests (standings, tiebreaks, callouts, finalize)
        run: node --test
      - name: Python tests (fetch, importer, data validator)
        run: python3 -m unittest discover -s tests -v
      - name: Validate the data files
        run: python3 scripts/validate_data.py
