<!doctype html>
<html lang="en" data-theme="terminal">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>NFL Wins Pool</title>
<script>
  // Themes: add a [data-theme="key"] block in style.css and one entry here.
  var THEMES = [["terminal", "Terminal"], ["broadcast", "Broadcast"], ["brutalist", "Brutalist"]];
  // Set the theme before first paint: ?theme=… beats the saved choice, then OS preference.
  (function () {
    var keys = THEMES.map(function (t) { return t[0]; }), t;
    try { t = new URLSearchParams(location.search).get("theme") || localStorage.getItem("theme"); } catch (e) {}
    if (keys.indexOf(t) < 0) t = matchMedia("(prefers-color-scheme: light)").matches ? "brutalist" : "terminal";
    document.documentElement.dataset.theme = t;
  })();
</script>
<link rel="stylesheet" href="style.css">
</head>
<body>
<main>
  <header>
    <h1>NFL <i>Wins</i> Pool</h1>
    <div class="sub" id="sub">Loading…</div>
    <div class="themes" id="themes" role="group" aria-label="Theme"></div>
  </header>
  <div id="root" class="leagues"></div>
  <div class="legend"><i style="color:var(--promo)">▌</i> promotion zone &nbsp; <i style="color:var(--rel)">▌</i> relegation zone &nbsp; · &nbsp; 🔥 most wins in a week &nbsp; 💩 fewest &nbsp; · &nbsp; ties broken by historic win %</div>
</main>
<script>
const pct = (x, d = 1) => (x * 100).toFixed(d) + "%";
const money = n => (n < 0 ? "-$" : "$") + Math.abs(n).toFixed(0);

function initThemes() {
  const el = document.getElementById("themes");
  const render = () => { el.innerHTML = THEMES.map(([k, n]) =>
    `<button data-t="${k}" aria-pressed="${document.documentElement.dataset.theme === k}">${n}</button>`).join(""); };
  el.addEventListener("click", e => {
    const t = e.target.dataset && e.target.dataset.t;
    if (!t) return;
    document.documentElement.dataset.theme = t;
    try { localStorage.setItem("theme", t); } catch (err) {}
    render();
  });
  render();
}

async function load() {
  const [league, wins, weeks] = await Promise.all(
    ["data/league.json", "data/wins.json", "data/weeks.json"].map(u =>
      fetch(u, { cache: "no-store" }).then(r => r.ok ? r.json() : null)));
  return { league, wins, weeks: weeks ? weeks.weeks : {} };
}

// Sum an owner's team records for the league.
function computeLeague(lg, teams) {
  const picksByOwner = {};
  lg.picks.forEach(p => (picksByOwner[p.owner] ||= []).push(p));
  const rows = lg.owners.map(o => {
    const mine = picksByOwner[o.name] || [];
    const s = { w: 0, l: 0, t: 0 };
    mine.forEach(p => { const r = teams[p.team] || { w: 0, l: 0, t: 0 }; s.w += r.w; s.l += r.l; s.t += r.t; });
    const g = s.w + s.l + s.t;
    return { ...o, ...s, g, pct: g ? s.w / g : 0 };
  });
  // Standings: most wins, then historic win %.
  rows.sort((a, b) => b.w - a.w || b.hist - a.hist);
  rows.forEach((r, i) => r.rank = i + 1);
  // Promotion/relegation tiebreakers: wins, then most ties, then historic win %.
  const pr = [...rows].sort((a, b) => b.w - a.w || b.t - a.t || b.hist - a.hist);
  pr.slice(0, lg.promote).forEach(r => r.zone = "promo");
  if (lg.relegate) pr.slice(-lg.relegate).forEach(r => r.zone = "rel");
  // Winner takes the pot.
  const pot = lg.buyIn * rows.length;
  rows.forEach(r => r.net = (r.rank === 1 ? pot : 0) - lg.buyIn);
  return { rows, pot };
}

// Weekly callouts: per league, the owner(s) with the most wins in a finished week get 🔥,
// the owner(s) with the fewest get 💩. Ties share the callout; nobody is called out if
// every owner won the same number of games.
function computeCallouts(lg, weeks) {
  const teamsByOwner = {};
  lg.picks.forEach(p => (teamsByOwner[p.owner] ||= []).push(p.team));
  const nums = Object.keys(weeks).map(Number).sort((a, b) => a - b);
  const out = { nums, byOwner: {}, weeks: {} };
  lg.owners.forEach(o => out.byOwner[o.name] = { fire: 0, poop: 0, wins: {} });
  nums.forEach(n => {
    const wk = weeks[n];
    const wins = {};
    lg.owners.forEach(o => {
      wins[o.name] = teamsByOwner[o.name].filter(t => wk.results[t] === "W").length;
      out.byOwner[o.name].wins[n] = wins[o.name];
    });
    const vals = Object.values(wins), max = Math.max(...vals), min = Math.min(...vals);
    const info = { complete: wk.complete, fire: [], poop: [] };
    if (wk.complete && max !== min) {
      lg.owners.forEach(o => {
        if (wins[o.name] === max) { info.fire.push(o.name); out.byOwner[o.name].fire++; }
        if (wins[o.name] === min) { info.poop.push(o.name); out.byOwner[o.name].poop++; }
      });
    }
    out.weeks[n] = info;
  });
  return out;
}

function strip(c) {
  const done = c.nums.filter(n => c.weeks[n].complete);
  const last = done[done.length - 1];
  if (!last) return "";
  return `<div class="strip"><b>Wk ${last}</b><span>🔥 ${c.weeks[last].fire.join(", ") || "—"}</span>
    <span>💩 ${c.weeks[last].poop.join(", ") || "—"}</span></div>`;
}

function standingsTable(c, co) {
  const tally = co.nums.length > 0;
  const maxW = Math.max(1, ...c.rows.map(r => r.w));
  const body = c.rows.map(r => `<tr class="${r.zone ? "z-" + r.zone : ""}">
    <td class="rank">${r.rank}</td><td class="l owner">${r.name}</td>
    <td class="w" style="--p:${Math.round(r.w / maxW * 100)}%">${r.w}</td>
    <td>${r.l}</td><td>${r.t}</td><td class="dim">${r.g}</td>
    <td>${pct(r.pct)}</td><td class="dim">${pct(r.hist)}</td>
    ${tally ? `<td>${co.byOwner[r.name].fire}</td><td>${co.byOwner[r.name].poop}</td>` : ""}
    <td class="${r.net > 0 ? "pos" : "dim"}">${money(r.net)}</td></tr>`).join("");
  return `<table><thead><tr><th>#</th><th class="l">Owner</th><th>W</th><th>L</th><th>T</th><th>GP</th>
    <th>Win%</th><th>Hist%</th>${tally ? "<th>🔥</th><th>💩</th>" : ""}<th>Net</th></tr></thead><tbody>${body}</tbody></table>`;
}

function draftTable(lg, teams) {
  const body = lg.picks.map(p => {
    const r = teams[p.team] || { w: 0, l: 0, t: 0 };
    return `<tr><td class="dim">${p.pick}</td><td class="l">${p.team}</td>
      <td class="l owner">${p.owner}</td><td>${r.w}-${r.l}${r.t ? "-" + r.t : ""}</td></tr>`;
  }).join("");
  return `<table><thead><tr><th>Pick</th><th class="l">Team</th><th class="l">Owner</th><th>Rec</th></tr></thead>
    <tbody>${body}</tbody></table>`;
}

function weeklyGrid(c, rows) {
  const th = c.nums.map(n => `<th class="wk${c.weeks[n].complete ? "" : " live"}">${n}</th>`).join("");
  const body = rows.map(r => {
    const o = c.byOwner[r.name];
    const cells = c.nums.map(n => {
      const i = c.weeks[n];
      const mark = i.fire.includes(r.name) ? " 🔥" : i.poop.includes(r.name) ? " 💩" : "";
      return `<td class="wk${i.complete ? "" : " live"}">${o.wins[n]}${mark}</td>`;
    }).join("");
    return `<tr><td class="l owner">${r.name}</td>${cells}</tr>`;
  }).join("");
  return `<table><thead><tr><th class="l">Wins / wk</th>${th}</tr></thead><tbody>${body}</tbody></table>`;
}

initThemes();
load().then(({ league, wins, weeks }) => {
  const upd = wins.updated ? ` · updated ${new Date(wins.updated).toLocaleString([], { dateStyle: "medium", timeStyle: "short" })}` : "";
  document.getElementById("sub").textContent = `${league.season} · regular season${upd}`;
  document.getElementById("root").innerHTML = league.leagues.map(lg => {
    const c = computeLeague(lg, wins.teams);
    const co = computeCallouts(lg, weeks);
    return `<section><h2>${lg.name}<small>$${lg.buyIn} × ${lg.owners.length} = $${c.pot} · winner takes all</small></h2>
      ${strip(co)}
      <div class="tbl">${standingsTable(c, co)}</div>
      <details><summary>Draft order</summary><div class="scroll">${draftTable(lg, wins.teams)}</div></details>
      ${co.nums.length ? `<details><summary>Weekly wins</summary><div class="scroll">${weeklyGrid(co, c.rows)}</div></details>` : ""}
    </section>`;
  }).join("");
}).catch(e => {
  document.getElementById("sub").textContent = "";
  document.getElementById("root").innerHTML =
    `<div class="err">Could not load data (${e.message}). Serve this folder over http, e.g. <code>python3 -m http.server</code>.</div>`;
});
</script>
</body>
</html>
